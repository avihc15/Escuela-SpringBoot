
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asignaciones | Escuela Sarah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">ESCUELA SARAH</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/alumnos">Alumnos</a>
                <a class="nav-link" href="/profesores">Profesores</a>
                <a class="nav-link" href="/materias">Materias</a>
                <a class="nav-link active" href="/asignaciones">Asignaciones</a>
            </div>
        </div>
    </div>
</nav>

<header class="encabezado-modulo">
    <div class="container">
        <p class="etiqueta">GESTIÓN ACADÉMICA</p>
        <h1>Asignaciones académicas</h1>
        <p>Organiza las materias que cursan los alumnos y
            las que imparten los profesores.</p>
    </div>
</header>

<main class="container contenido-modulo">

    <div id="mensaje" class="alert d-none" role="alert"></div>

    <ul class="nav nav-pills mb-4 gap-2" id="pestanas">
        <li class="nav-item">
            <button class="nav-link active" type="button"
                    data-tipo="alumnos">
                Alumnos y materias
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" type="button"
                    data-tipo="profesores">
                Profesores y materias
            </button>
        </li>
    </ul>

    <div class="barra-acciones">
        <div>
            <h2 id="tituloTabla">Inscripciones</h2>
            <p id="descripcionTabla">
                Materias que cursan los alumnos.
            </p>
        </div>
        <button class="btn btn-amarillo" id="btnNuevo">
            + Inscribir alumno
        </button>
    </div>

    <input id="buscador" class="buscador"
           placeholder="Buscar alumno o materia...">

    <div class="tabla-contenedor table-responsive">
        <table class="table table-hover">
            <thead id="encabezados"></thead>
            <tbody id="tablaDatos"></tbody>
        </table>
    </div>
</main>

<div class="modal fade" id="modalAsignacion" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="formulario">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">
                        Nueva asignación
                    </h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" id="etiquetaPersona"
                               for="persona">
                            Alumno
                        </label>
                        <select id="persona" class="form-select" required>
                            <option value="">Selecciona una opción</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="materia">
                            Materia
                        </label>
                        <select id="materia" class="form-select" required>
                            <option value="">Selecciona una materia</option>
                        </select>
                    </div>

                    <div class="mb-3" id="grupoCalificacion">
                        <label class="form-label" for="calificacion">
                            Calificación (opcional)
                        </label>
                        <input type="number" id="calificacion"
                               class="form-control"
                               min="0" max="10" step="0.01"
                               placeholder="De 0 a 10">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-amarillo">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/asignaciones.js"></script>
</body>
</html>
