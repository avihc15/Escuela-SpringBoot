
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profesores | Escuela Sarah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body data-api="/api/profesores">

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">ESCUELA SARAH</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/alumnos">Alumnos</a>
                <a class="nav-link active" href="/profesores">Profesores</a>
                <a class="nav-link" href="/materias">Materias</a>
            </div>
        </div>
    </div>
</nav>

<header class="encabezado-modulo amarillo">
    <div class="container">
        <p class="etiqueta">GESTIÓN ACADÉMICA</p>
        <h1>Profesores</h1>
        <p>Administra la información del equipo docente.</p>
    </div>
</header>

<main class="container contenido-modulo">
    <div class="barra-acciones">
        <div>
            <h2>Registro de profesores</h2>
            <p>Consulta y administración del personal docente.</p>
        </div>
        <button class="btn btn-amarillo" id="btnNuevo">
            + Nuevo profesor
        </button>
    </div>

    <div id="mensaje" class="alert d-none" role="alert"></div>

    <input class="buscador" id="buscador"
           placeholder="Buscar profesor por nombre..."
           aria-label="Buscar profesor">

    <div class="tabla-contenedor table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tablaDatos"></tbody>
        </table>
    </div>
</main>

<div class="modal fade" id="modalRegistro" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="formulario">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">
                        Nuevo profesor
                    </h5>
                    <button class="btn-close" type="button"
                            data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input class="form-control" id="nombre"
                               name="nombre" required maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="especialidad">
                            Especialidad
                        </label>
                        <input class="form-control" id="especialidad"
                               name="especialidad" required maxlength="100">
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-light" type="button"
                            data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-amarillo" type="submit">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/administracion.js"></script>
</body>
</html>
